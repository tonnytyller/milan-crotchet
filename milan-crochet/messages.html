<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages - Milan Crochet</title>
  <link rel="stylesheet" href="/milan-crochet/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .chat { display: grid; grid-template-columns: 280px 1fr; gap: 12px; height: calc(100vh - 100px); }
    .conversations { border-right: 1px solid var(--color-gray-200); padding-right: 12px; overflow: auto; }
    .thread { display: grid; gap: 8px; align-content: end; overflow: auto; padding-bottom: 12px; }
    .msg { max-width: 70%; padding: 8px 10px; border-radius: 12px; background: #f1f5f9; }
    .msg.me { background: #e0f2fe; justify-self: end; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  </style>
</head>
<body>
  <div class="header-spacer"></div>
  <main class="container chat">
    <aside class="conversations" id="conversations"></aside>
    <section>
      <div id="thread" class="thread"></div>
      <div class="composer">
        <input id="composer-input" placeholder="Type a message" />
        <button id="send" class="btn btn-primary">Send</button>
      </div>
    </section>
  </main>
  <script type="module" src="/milan-crochet/js/components/header.js"></script>
  <script type="module" src="/milan-crochet/js/supabase/supabase-client.js"></script>
  <script type="module" src="/milan-crochet/js/features/chat.js"></script>
  <script type="module" src="/milan-crochet/js/pages/messages.js"></script>
</body>
</html>
