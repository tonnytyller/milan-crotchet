<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stories - Milan Crochet</title>
  <link rel="stylesheet" href="/milan-crochet/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .stories-bar { display: grid; grid-auto-flow: column; grid-auto-columns: 96px; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .story { width: 96px; height: 160px; background: #f3f4f6; border-radius: 16px; overflow: hidden; position: relative; }
    .story img { width: 100%; height: 100%; object-fit: cover; }
    .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,0.4); }
    .progress span { display: block; height: 100%; width: 0; background: white; transition: width 3s linear; }
  </style>
</head>
<body>
  <div class="header-spacer"></div>
  <main class="container">
    <h1>Stories</h1>
    <div class="stories-bar" id="stories"></div>
  </main>
  <script type="module" src="/milan-crochet/js/components/header.js"></script>
  <script type="module" src="/milan-crochet/js/supabase/supabase-client.js"></script>
  <script type="module" src="/milan-crochet/js/features/stories.js"></script>
  <script type="module" src="/milan-crochet/js/pages/stories.js"></script>
</body>
</html>
