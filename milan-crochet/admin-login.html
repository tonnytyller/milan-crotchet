<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Milan Crochet</title>
  <link rel="stylesheet" href="/milan-crochet/css/style.css">
  <link rel="stylesheet" href="/milan-crochet/css/components/forms.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container" style="padding-top: 72px">
    <h1>Admin Login</h1>
    <form id="admin-login-form" class="row" style="max-width: 420px">
      <div class="input"><label>Email</label><input name="email" type="email" required></div>
      <div class="input"><label>Password</label><input name="password" type="password" required></div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
  </main>
  <script type="module" src="/milan-crochet/js/supabase/supabase-client.js"></script>
  <script type="module" src="/milan-crochet/js/supabase/auth.js"></script>
  <script type="module" src="/milan-crochet/js/pages/admin-login.js"></script>
</body>
</html>
