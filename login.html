        * {

            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f9fafb;
            padding: 20px;
        }
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

        h1 {
            text-align: center;
            color: #f97316;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #f97316;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #ea580c;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            display: none;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e5e7eb;
        }
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: #f9fafb;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .tab.active {
            background: #f97316;
            color: white;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>

        // SIMPLE TAB SWITCHING
        function switchTab(tabName) {
            console.log('Switching to:', tabName);
            
            // Hide all forms
            document.querySelectorAll('.form').forEach(form => {
                form.classList.remove('active');
            });
            
            // Remove active from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected form
            document.getElementById(tabName + '-form').classList.add('active');
            
            // Activate clicked tab
            event.target.classList.add('active');
            
            // Clear messages
            document.querySelectorAll('.message').forEach(msg => {
                msg.className = 'message';
            });
        }

        // REAL LOGIN FUNCTION WITH SUPABASE
        async function handleLogin() {
            console.log('Login button clicked!');
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const messageEl = document.getElementById('login-message');
            const button = document.getElementById('login-btn');
            
            if (!email || !password) {
                showMessage(messageEl, 'Please fill in all fields', 'error');
                return;
            }
            
            // Show loading state
            button.textContent = 'Logging in...';
            button.disabled = true;
            document.getElementById('login-form').classList.add('loading');
            
            try {
                console.log('Attempting Supabase login...');
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('Login error:', error);
                    showMessage(messageEl, error.message, 'error');
                    return;
                }
                
                if (data.user) {
                    console.log('✅ Login successful!', data.user);
                    showMessage(messageEl, 'Login successful! Redirecting...', 'success');
                    
                    // Create user profile if it doesn't exist
                    await createUserProfile(data.user);
                    
                    // Redirect to home page
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
                
            } catch (error) {
                console.error('Login exception:', error);
                showMessage(messageEl, 'Login failed. Please try again.', 'error');
            } finally {
                // Reset button
                button.textContent = 'Login';
                button.disabled = false;
                document.getElementById('login-form').classList.remove('loading');
            }
        }

        // REAL REGISTER FUNCTION WITH SUPABASE
        async function handleRegister() {
            console.log('Register button clicked!');
            
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const phone = document.getElementById('register-phone').value;
            const password = document.getElementById('register-password').value;
            const messageEl = document.getElementById('register-message');
            const button = document.getElementById('register-btn');
            
            if (!name || !email || !phone || !password) {
                showMessage(messageEl, 'Please fill in all fields', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage(messageEl, 'Password must be 6+ characters', 'error');
                return;
            }
            
            // Show loading state
            button.textContent = 'Creating Account...';
            button.disabled = true;
            document.getElementById('register-form').classList.add('loading');
            
            try {
                console.log('Attempting Supabase registration...');
                
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            phone: phone
                        }
                    }
                });
                
                if (error) {
                    console.error('Registration error:', error);
                    showMessage(messageEl, error.message, 'error');
                    return;
                }
                
                if (data.user) {
                    console.log('✅ Registration successful!', data.user);
                    
                    // Create profile in database
                    await createUserProfile(data.user, { name, phone });
                    
                    showMessage(messageEl, 
                        'Account created successfully! Please check your email for verification.', 
                        'success'
                    );
                    
                    // Clear form
                    document.getElementById('register-name').value = '';
                    document.getElementById('register-email').value = '';
                    document.getElementById('register-phone').value = '';
                    document.getElementById('register-password').value = '';
                    
                    // Switch to login after delay
                    setTimeout(() => {
                        switchTab('login');
                    }, 3000);
                }
                
            } catch (error) {
                console.error('Registration exception:', error);
                showMessage(messageEl, 'Registration failed. Please try again.', 'error');
            } finally {
                // Reset button
                button.textContent = 'Create Account';
                button.disabled = false;
                document.getElementById('register-form').classList.remove('loading');
            }
        }

        // REAL PASSWORD RESET FUNCTION
        async function handleReset() {
            console.log('Reset button clicked!');
            
            const email = document.getElementById('reset-email').value;
            const messageEl = document.getElementById('reset-message');
            const button = document.getElementById('reset-btn');
            
            if (!email) {
                showMessage(messageEl, 'Please enter your email', 'error');
                return;
            }
            
            // Show loading state
            button.textContent = 'Sending...';
            button.disabled = true;
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email);
                
                if (error) {
                    console.error('Reset error:', error);
                    showMessage(messageEl, error.message, 'error');
                    return;
                }
                
                showMessage(messageEl, 'Password reset link sent to your email!', 'success');
                document.getElementById('reset-email').value = '';
                
            } catch (error) {
                console.error('Reset exception:', error);
                showMessage(messageEl, 'Failed to send reset link', 'error');
            } finally {
                // Reset button
                button.textContent = 'Send Reset Link';
                button.disabled = false;
            }
        }

        // CREATE USER PROFILE IN DATABASE
        async function createUserProfile(user, userData = {}) {
            try {
                // Check if profile already exists
                const { data: existingProfile } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();
                
                if (!existingProfile) {
                    // Create new profile
                    const { error } = await supabase
                        .from('profiles')
                        .insert({
                            id: user.id,
                            username: user.email.split('@')[0],
                            full_name: userData.name || user.user_metadata?.full_name,
                            phone: userData.phone || user.user_metadata?.phone,
                            role: 'customer'
                        });
                    
                    if (error) {
                        console.error('Error creating profile:', error);
                    } else {
                        console.log('✅ User profile created');
                    }
                }
            } catch (error) {
                console.error('Profile creation error:', error);
            }
        }

        // MESSAGE HELPER
        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = 'message ' + type;
            console.log(type + ': ' + text);
        }

        // ENTER KEY SUPPORT
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                const activeForm = document.querySelector('.form.active');
                if (activeForm.id === 'login-form') handleLogin();
                if (activeForm.id === 'register-form') handleRegister();
                if (activeForm.id === 'reset-form') handleReset();
            }
        });

        // CHECK IF USER IS ALREADY LOGGED IN
        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                console.log('User already logged in, redirecting...');
                window.location.href = 'index.html';
            }
        }

        // Initialize
        console.log('✅ Login page loaded successfully!');
        checkAuthStatus();

// Google Login Function
async function loginWithGoogle() {
    console.log('🔐 Attempting Google login...');
    
    const messageEl = document.getElementById('login-message');
    
    try {
        const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin + '/index.html',
                queryParams: {
                    access_type: 'offline',
                    prompt: 'consent'
                }
            }
        });
        
        if (error) {
            console.error('Google login error:', error);
            showMessage(messageEl, error.message, 'error');
            return;
        }
        
        console.log('✅ Google login initiated:', data);
        showMessage(messageEl, 'Redirecting to Google...', 'success');
        
    } catch (error) {
        console.error('Google login exception:', error);
        showMessage(messageEl, 'Google login failed. Please try again.', 'error');
    }
}

    } catch (error) {

        showMessage(messageEl, 'Spotify login failed. Please try again.', 'error');
    }
}
