<body>
    <div class="admin-login-container">

    <script>
    console.log('🚀 Starting admin login...');

    // Show alert message
    function showAlert(message, type = 'error') {
        const alertDiv = document.getElementById('alert');
        if (alertDiv) {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 3000);
            }
        }
    }

    // Check if user is already logged in
    function checkExistingSession() {
        const adminToken = localStorage.getItem('admin_token');
        if (adminToken) {
            try {
                const session = JSON.parse(adminToken);
                if (session && session.isAdmin) {
                    console.log('🔄 Existing admin session found, redirecting...');
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Error parsing admin token:', error);
                localStorage.removeItem('admin_token');
            }
        }
    }

    // Handle login form submission
    async function handleLogin(event) {
        event.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');

        // Basic validation
        if (!email || !password) {
            showAlert('Please fill in all fields');
            return;
        }

        // Show loading state
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        try {
            console.log('🔐 Attempting admin login for:', email);
            
            // Use the existing Supabase instance that's already working
            const { data: adminUser, error: adminError } = await window.supabase
                .from('admin_users')
                .select('*')
                .eq('email', email)
                .single();

            if (adminError) {
                console.error('Admin user query error:', adminError);
                
                if (adminError.code === 'PGRST116') {
                    showAlert('Invalid admin credentials');
                } else {
                    showAlert('Database error. Please try again.');
                }
                
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In to Admin Panel';
                return;
            }

            if (!adminUser) {
                showAlert('Invalid admin credentials');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In to Admin Panel';
                return;
            }

            console.log('👤 Admin user found:', adminUser.name);

            // Simple password check
            if (password === adminUser.password_hash) {
                // Create admin session
                const adminSession = {
                    id: adminUser.id,
                    email: adminUser.email,
                    name: adminUser.name,
                    role: adminUser.role,
                    isAdmin: true,
                    loginTime: new Date().toISOString()
                };

                // Store session
                localStorage.setItem('admin_token', JSON.stringify(adminSession));
                localStorage.setItem('admin_last_login', new Date().toISOString());

                console.log('✅ Login successful, redirecting to dashboard...');
                showAlert('Login successful! Redirecting...', 'success');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                console.log('❌ Invalid password');
                showAlert('Invalid password');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In to Admin Panel';
            }

        } catch (error) {
            console.error('Login error:', error);
            showAlert('Login failed. Please try again.');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In to Admin Panel';
        }
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ Admin login page ready');
        
        // Check if Supabase is available
        if (!window.supabase) {
            showAlert('Database connection not available. Please go to the main site first.');
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Go to Main Site First';
            }
            return;
        }

        console.log('✅ Supabase is available:', window.supabase);

        // Set up event listeners
        const loginForm = document.getElementById('adminLoginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', handleLogin);
        }

        // Check for existing session
        checkExistingSession();

        console.log('✅ Admin login page initialized successfully');
    });

    async function signInWithGoogle() {
    const { data, error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
    })

    if (error) {
      console.error('Login error:', error.message)
    } else {
      console.log('Redirecting to Google...')
    }
  }
</script>
