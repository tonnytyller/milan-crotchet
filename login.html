<!-- Login Modal -->
<div id="loginModal" class="login-modal">
  <div class="login-content">
    <!-- Header -->
    <div class="login-header">
      <button class="close-login" id="closeLogin">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="login-logo">
        <div class="logo-icon">M</div>
        <span class="logo-text">Milan Crochet</span>
      </div>
    </div>

    <!-- Login Body -->
    <div class="login-body">
      <h2>Welcome to Milan Crochet</h2>
      <p>Login to track orders, save favorites, and shop faster</p>

      <!-- Social Login Buttons -->
      <div class="social-login-buttons">
        <button class="social-btn google-btn" id="googleLogin">
          <div class="social-icon">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </div>
          <span>Continue with Google</span>
        </button>

        <button class="social-btn instagram-btn" id="instagramLogin">
          <div class="social-icon">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <radialGradient id="instagram-gradient" r="150%" cx="30%" cy="107%">
                <stop stop-color="#fdf497" offset="0"/>
                <stop stop-color="#fdf497" offset="0.05"/>
                <stop stop-color="#fd5949" offset="0.45"/>
                <stop stop-color="#d6249f" offset="0.6"/>
                <stop stop-color="#285AEB" offset="0.9"/>

            </svg>
          </div>
          <span>Continue with Instagram</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="login-divider">
        <span>or</span>
      </div>

      <!-- Email/Phone Option (Future) -->
      <div class="email-option">
        <button class="email-btn" id="emailLogin" disabled>
          <i class="fas fa-envelope"></i>
          <span>Use Email (Coming Soon)</span>
        </button>
      </div>

      <!-- Terms -->
      <div class="login-terms">
        <p>By continuing, you agree to Milan Crochet's <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
      </div>
    </div>
  </div>
  <div class="login-overlay" id="loginOverlay"></div>
</div>
